<!DOCTYPE html>
<html lang="en">


    <head>
        <title>Tic Tac Toe</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    </head>

    <body>
        <div class="container">
            <div class="row">
                <div class="col-lg-1">
                    &nbsp;
                </div>
                <div class="col-lg-10 alert" role="alert" id="msg"></div>
                <div class="col-lg-1">
                    &nbsp;
                </div>

            </div>

            <div clas="row">
                <div class="col-lg-2"> </div>
                <div class="col-lg-8">

                    <form id="form-setup">
                        <div class="form-group">
                            <div class="row">
                                <div class="col-lg-6">
                                    <label for="text-size">Board Size</label>
                                </div>

                                <div class="col-lg-6">
                                    <label for="text-main-player">Pick your player</label>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-lg-6">
                                    <input id="text-size" class="form-control" type="number" min="3">
                                </div>

                                <div class="col-lg-6">
                                    <input type="radio" value="X" name="player">X</input>
                                    <input type="radio" value="O" name="player">O</input>

                                </div>
                            </div>
                            <div class="row">

                                <div class="col-lg-12">
                                    <input type="submit" class="btn btn-primary float-end" value="Generate">
                                </div>
                            </div>


                        </div>
                    </form>
                </div>
                <div class="col-lg-2"> </div>
            </div>

            <div class="row">
                <div class="col-lg-2"> </div>
                <div class="col-lg-8">
                    <table class="table table-sm table-bordered" id="table-board">
                        <tbody id="table-board-body">

                        </tbody>
                    </table>


                </div>
                <div class="col-lg-2"> </div>
            </div>


        </div>


        <script src="src/TicTacToe.js" type="text/javascript"></script>

    </body>

</html>
